# Socket
bind 127.0.0.1
port 5000

# Logfile path
# Uncomment to write to system log directory (requires write permissions):
# logfile /var/log/ramora/ramora.log

# Hashmap
max_load_factor 0.7
migrating_load 4
initial_hmap_cap 131072

# Memory Management & Eviction
# maxmemory: Memory limit in bytes (or suffixes like 10mb, 100kb, 1gb). Set to 0 for unlimited.
maxmemory 0
# maxmemory_policy: Eviction policy when maxmemory is reached.
# Options:
#   noeviction    - Return OOM error on write commands
#   volatile-ttl  - Evict keys with an expiration set, shortest TTL first (via min-heap)
#   allkeys-lru   - Evict least recently used keys (sampled approximated LRU)
#   allkeys-random- Evict random keys from keyspace
maxmemory_policy volatile-ttl

initial_heap_cap 2048
initial_buffer_cap 16384
max_buffer_cap 16777216

# Networking
max_payload_size 4096
max_pooled_conn_count 128
idle_timeout_ms 60000
# Set idle_timeout_ms <= 0 to disable idle timeout

# Event loop
read_chunk 8192
max_events 2048

# Security & Authentication
requirepass Pass
max_auth_failures 3
auth_lockout_ms 10000

# Persistence
snapshot_file ramora.snapshot


